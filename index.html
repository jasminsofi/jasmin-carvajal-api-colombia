<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Colombia - Departamentos </title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo"> DESCUBRE COLOMBIA</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Departamentos</a></li>
                    <li><a href="platos.html">Sabores Típicos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <h2>Exploracion de los Departamentos de Colombia</h2>
            <p>Conoce la diversidad territorial y demografica de cada Despartamento de Colombia </p>
        </section>

        <!--Conteo de departamentos por Regiones-->
        <section id="resumen-regiones" class="stats-container" aria-label="Resumen por regiones"></section>

        <!--Estado de carga y manejo de errores-->
        <div id="estado-carga" class="status-box loading">Cargando departamentos desde la API...</div>
        <div id="estado-error" class="status-box error hidden"></div>

        <!--Contenedor dinamico del DOM-->
        <section id="lista-departamentos" class="grid-cards"></section>

    </main>

    <footer class="footer">
        <p>Datos obtenidos de <a href="https://api-colombia.com/" target="_blank" rel="noopener noreferrer">API Colombia </a></p>

    </footer>
    <script src="js/departamentos.js"></script>
</body>
</html>
